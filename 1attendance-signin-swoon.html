<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Swoon of Faith — Sign-In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0f0f1a;
      --surface: #161628;
      --surface2: #1e1e34;
      --surface3: #242440;
      --text: #dde4f0;
      --text-muted: #6e7e9e;
      --border: #282845;
      --arrived-bg: #132518;
      --arrived-border: #2a5c38;
      --arrived-text: #86c99e;
      --departed-bg: #361808;
      --departed-border: #7a3808;
      --departed-text: #d8936a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
      font-weight: 100;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .screen { display: none; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ════════════════════════════════════════
       NAMES SCREEN (home)
    ════════════════════════════════════════ */
    .names-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding: 14px 16px 12px;
    }
    .names-header-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .names-back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 10px 4px 0;
      font-weight: 300;
    }
    .names-back-btn.visible { display: block; }
    .header-text { flex: 1; }
    .header-title { font-size: 18px; font-weight: 400; letter-spacing: 0.01em; }
    .header-sub   { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 300; }
    .names-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 10px;
    }
    .names-greeting { font-size: 13px; color: var(--text-muted); font-weight: 300; }
    .names-date     { font-size: 12px; color: var(--text-muted); font-weight: 300; }

    /* ── Names grid ── */
    #names-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    #names-list.cols3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .name-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 8px;
      color: var(--text);
      font-size: 22px;
      font-weight: 100;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transition: opacity 0.1s, transform 0.1s;
      line-height: 1.3;
      min-height: 80px;
    }
    .name-btn:active { opacity: 0.72; transform: scale(0.95); }

    .name-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: transparent;
    }
    .name-btn.status-arrived  .name-dot { background: #50aa78; }
    .name-btn.status-departed .name-dot { background: #b87840; }

    /* "1.1 Devotees" button — spans full width */
    .sublist-btn {
      grid-column: 1 / -1;
      background: var(--surface3);
      border: 1px solid #3a3060;
      border-radius: 12px;
      padding: 16px 12px;
      color: #a898d0;
      font-size: 18px;
      font-weight: 300;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 60px;
      transition: opacity 0.1s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .sublist-btn:active { opacity: 0.72; transform: scale(0.97); }

    .section-divider {
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 8px 4px 2px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    /* ════════════════════════════════════════
       EVENTS SCREEN
    ════════════════════════════════════════ */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .events-nav-row {
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .events-back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 12px 4px 0;
      font-weight: 300;
    }
    .home-top-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      padding: 9px 16px;
      transition: background 0.15s;
    }
    .home-top-btn:active { background: var(--surface3); }

    .done-row {
      display: flex;
      justify-content: center;
      padding: 4px 14px 8px;
    }
    .done-btn {
      background: #1e4028;
      border: 1.5px solid #4a8c5c;
      border-radius: 14px;
      color: #b8e8c8;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 12px 56px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .done-btn:active { background: #132518; border-color: #2a5c38; color: #86c99e; }
    .done-btn.done-clicked { background: #132518; border-color: #2a5c38; color: #86c99e; transition: background 0.4s, border-color 0.4s, color 0.4s; }

    .events-person-bar {
      padding: 6px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .events-person-name { font-size: 16px; font-weight: 400; }
    .events-person-sub  { font-size: 12px; color: var(--text-muted); margin-top: 1px; font-weight: 300; }

    .timer-bar { height: 2px; background: var(--border); flex-shrink: 0; }
    .timer-fill { height: 100%; background: #2a5c40; width: 100%; }

    #events-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-content: start;
    }

    .event-btn {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 22px 10px;
      color: var(--text);
      font-size: 21px;
      font-weight: 100;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.1s, transform 0.1s;
      text-align: center;
      line-height: 1.25;
      min-height: 100px;
    }
    .event-btn:nth-child(odd)  { background: var(--surface2); }
    .event-btn:nth-child(even) { background: var(--surface3); }
    .event-btn:active { opacity: 0.72; transform: scale(0.97); }
    .event-btn.arrived  { background: var(--arrived-bg)  !important; border-color: var(--arrived-border);  color: var(--arrived-text);  }
    .event-btn.departed { background: var(--departed-bg) !important; border-color: var(--departed-border); color: var(--departed-text); }
    .event-icon { font-size: 17px; opacity: 0.8; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 36px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #1a2438;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px; font-weight: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 300;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Admin ── */
    .admin-toggle {
      position: fixed;
      bottom: 14px; right: 14px;
      width: 36px; height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .admin-overlay {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: flex-end;
    }
    .admin-overlay.open { display: flex; }
    .admin-sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 36px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
    }
    .admin-sheet h2 { font-size: 16px; font-weight: 400; margin-bottom: 14px; }
    .admin-btn {
      display: block; width: 100%;
      padding: 13px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px; font-weight: 300;
      cursor: pointer; text-align: left;
      margin-bottom: 8px;
    }
    .admin-close {
      display: block; width: 100%;
      padding: 13px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 15px; font-weight: 300;
      cursor: pointer; margin-top: 6px;
    }
    .record-summary {
      background: var(--surface2);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .record-summary strong { color: var(--text); font-weight: 400; }
    .csv-output { display: none; margin-top: 12px; }
    .csv-output textarea {
      width: 100%; height: 160px;
      background: #0a0a14;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #8ab4d8;
      font-size: 11px;
      font-family: monospace;
      padding: 10px; resize: none;
    }
    .csv-select-btn {
      display: block; width: 100%;
      padding: 11px 16px;
      background: #1a2e48;
      border: 1px solid #2a5c80;
      border-radius: 10px;
      color: #8ab4d8;
      font-size: 14px; font-weight: 400;
      cursor: pointer; text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     Screen 1 — Names (home)
═══════════════════════════════════════════ -->
<div id="screen-names" class="screen active">
  <div class="names-header">
    <div class="names-header-top">
      <button class="names-back-btn" id="names-back-btn" onclick="goMainNames()">← Back</button>
      <div class="header-text">
        <div id="names-title" class="header-title">Swoon of Faith</div>
        <div id="names-sub" class="header-sub">Please record your attendance</div>
      </div>
    </div>
    <div class="names-meta" id="names-meta">
      <span class="names-greeting" id="names-greeting"></span>
      <span class="names-date" id="names-date"></span>
    </div>
  </div>
  <div id="names-list"></div>
</div>

<!-- ══════════════════════════════════════════
     Screen 2 — Events
═══════════════════════════════════════════ -->
<div id="screen-events" class="screen">
  <div class="header">
    <div class="events-nav-row">
      <button class="events-back-btn" onclick="goNames()">←  Names</button>
      <button class="home-top-btn"    onclick="goNames()">Home</button>
    </div>
    <div class="done-row">
      <button class="done-btn" id="done-btn" onclick="tapDone(this)">Done</button>
    </div>
    <div class="events-person-bar">
      <div id="events-name" class="events-person-name"></div>
      <div id="events-sub"  class="events-person-sub"></div>
    </div>
  </div>
  <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
  <div id="events-list"></div>
</div>

<div id="toast"></div>
<button class="admin-toggle" onclick="openAdmin()" title="Admin">⚙</button>
<div id="admin-overlay" class="admin-overlay" onclick="maybeCloseAdmin(event)">
  <div class="admin-sheet" onclick="if(event&&event.stopPropagation)event.stopPropagation()">
    <h2>Admin — Swoon of Faith</h2>
    <button class="admin-btn" onclick="exportCSV()">📥 Show CSV data</button>
    <button class="admin-btn" onclick="clearToday()">🗑 Clear today's records</button>
    <button class="admin-btn" id="clear-all-btn" onclick="clearAll()">⚠️ Clear all data</button>
    <div id="admin-records" style="margin-top:14px;"></div>
    <div class="csv-output" id="csv-output">
      <textarea id="csv-text" readonly></textarea>
      <button class="csv-select-btn" onclick="selectCSV()">Select all — then copy</button>
    </div>
    <button class="admin-close" onclick="closeAdmin()">Close</button>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────

var HALL_NAME    = 'Swoon of Faith';
var SCHEDULE_KEY = 'SoF';

var MAIN_DEVOTEES = ['Ben', 'Blythe', 'Madhuka', 'Yvonne'];

var SUB_MEN    = ['Bob', 'Gilbert', 'Hoi', 'Joseph', 'Leo', 'Malcolm', 'Michael', 'Miki', 'Robin'];
var SUB_LADIES = ['Carol', 'Diane', 'Krysia', 'Lindsay', 'Lisa', 'Radha', 'Vanessa'];

var EVENTS = ['AM Meditation', 'PM Meditation', '11am Meditation'];

// ── State ─────────────────────────────────────────────────

var currentPerson   = null;
var showingSublist  = false;
var tapReturnTimer  = null;
var autoTimer       = null;
var toastTimer      = null;
var clearAllConfirm = false;
var clearAllTimer   = null;
var AUTO_TIMEOUT    = 30000;

var attendanceState = {};
var signins = [];

// ── Helpers ───────────────────────────────────────────────

function todayKey() {
  return new Date().toLocaleDateString('en-CA', {timeZone: 'Pacific/Fiji'});
}

function todayDisplay() {
  return new Date().toLocaleDateString('en-AU', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    timeZone: 'Pacific/Fiji'
  });
}

function getGreeting() {
  var hr = parseInt(new Date().toLocaleString('en-AU', {hour: 'numeric', hour12: false, timeZone: 'Pacific/Fiji'}));
  if (hr < 12) return 'Good morning';
  if (hr < 17) return 'Good afternoon';
  return 'Good evening';
}

function nowTime() {
  return new Date().toLocaleTimeString('en-AU', {hour: '2-digit', minute: '2-digit', timeZone: 'Pacific/Fiji'});
}

function loadData() {
  try { attendanceState = JSON.parse(localStorage.getItem('attendanceState_swoon') || '{}'); } catch(e) { attendanceState = {}; }
  try { signins = JSON.parse(localStorage.getItem('signins_swoon') || '[]'); } catch(e) { signins = []; }
}

function saveData() {
  localStorage.setItem('attendanceState_swoon', JSON.stringify(attendanceState));
  localStorage.setItem('signins_swoon', JSON.stringify(signins));
}

function getState(person, event) {
  var d = attendanceState[todayKey()];
  var s = d && d[SCHEDULE_KEY];
  var p = s && s[person];
  return (p && p[event]) || null;
}

function setState(person, event, val) {
  var dk = todayKey();
  if (!attendanceState[dk]) attendanceState[dk] = {};
  if (!attendanceState[dk][SCHEDULE_KEY]) attendanceState[dk][SCHEDULE_KEY] = {};
  if (!attendanceState[dk][SCHEDULE_KEY][person]) attendanceState[dk][SCHEDULE_KEY][person] = {};
  if (val === null) {
    delete attendanceState[dk][SCHEDULE_KEY][person][event];
  } else {
    attendanceState[dk][SCHEDULE_KEY][person][event] = val;
  }
  saveData();
}

function personStatus(person) {
  var d = attendanceState[todayKey()];
  var s = d && d[SCHEDULE_KEY];
  var data = s && s[person];
  if (!data) return null;
  var hasKeys = false;
  var foundDeparted = false;
  var foundArrived = false;
  for (var k in data) {
    if (data.hasOwnProperty(k)) {
      hasKeys = true;
      if (data[k] === 'departed') foundDeparted = true;
      if (data[k] === 'arrived')  foundArrived  = true;
    }
  }
  if (!hasKeys) return null;
  if (foundDeparted) return 'departed';
  if (foundArrived)  return 'arrived';
  return null;
}

// ── Screens ───────────────────────────────────────────────

function show(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function goNames() {
  stopTimer();
  if (tapReturnTimer) { clearTimeout(tapReturnTimer); tapReturnTimer = null; }
  showingSublist = false;
  renderNames();
  show('screen-names');
}

function goMainNames() {
  if (tapReturnTimer) { clearTimeout(tapReturnTimer); tapReturnTimer = null; }
  showingSublist = false;
  renderNames();
}

function renderNames() {
  var backBtn  = document.getElementById('names-back-btn');
  var titleEl  = document.getElementById('names-title');
  var subEl    = document.getElementById('names-sub');
  var metaEl   = document.getElementById('names-meta');
  var list     = document.getElementById('names-list');

  if (showingSublist) {
    backBtn.className = 'names-back-btn visible';
    titleEl.textContent = '1.1 Devotees';
    subEl.textContent   = 'Tap your name';
    metaEl.style.display = 'none';
    list.className = 'cols3';
  } else {
    backBtn.className = 'names-back-btn';
    titleEl.textContent = HALL_NAME;
    subEl.textContent   = 'Please record your attendance';
    metaEl.style.display = 'flex';
    document.getElementById('names-greeting').textContent = getGreeting();
    document.getElementById('names-date').textContent = todayDisplay();
    list.className = '';
  }

  list.innerHTML = '';

  if (showingSublist) {
    var menDiv = document.createElement('div');
    menDiv.className = 'section-divider';
    menDiv.textContent = 'Men';
    list.appendChild(menDiv);
    for (var i = 0; i < SUB_MEN.length; i++) list.appendChild(makeNameBtn(SUB_MEN[i]));

    var ladiesDiv = document.createElement('div');
    ladiesDiv.className = 'section-divider';
    ladiesDiv.textContent = 'Ladies';
    list.appendChild(ladiesDiv);
    for (var j = 0; j < SUB_LADIES.length; j++) list.appendChild(makeNameBtn(SUB_LADIES[j]));

  } else {
    for (var k = 0; k < MAIN_DEVOTEES.length; k++) list.appendChild(makeNameBtn(MAIN_DEVOTEES[k]));
    list.appendChild(makeSublistBtn());
  }
}

function makeNameBtn(name) {
  var btn = document.createElement('button');
  btn.className = 'name-btn';

  var dot = document.createElement('span');
  dot.className = 'name-dot';

  var label = document.createElement('span');
  label.textContent = name;

  btn.appendChild(dot);
  btn.appendChild(label);

  var status = personStatus(name);
  if (status) btn.classList.add('status-' + status);

  (function(n) {
    btn.onclick = function() { selectPerson(n); };
  })(name);

  return btn;
}

function makeSublistBtn() {
  var btn = document.createElement('button');
  btn.className = 'sublist-btn';
  btn.textContent = '1.1 Devotees  ›';
  btn.onclick = function() {
    showingSublist = true;
    renderNames();
  };
  return btn;
}

function selectPerson(name) {
  currentPerson = name;
  renderEvents();
  show('screen-events');
  startTimer();
}

function renderEvents() {
  document.getElementById('events-name').textContent = currentPerson;
  document.getElementById('events-sub').textContent  = 'Tap to sign in or out';

  var doneBtn = document.getElementById('done-btn');
  if (doneBtn) { doneBtn.disabled = false; doneBtn.classList.remove('done-clicked'); }

  var list = document.getElementById('events-list');
  list.innerHTML = '';

  for (var i = 0; i < EVENTS.length; i++) {
    list.appendChild(makeEventBtn(EVENTS[i]));
  }
}

function makeEventBtn(eventName) {
  var state = getState(currentPerson, eventName);
  var btn = document.createElement('button');
  btn.className = 'event-btn' + (state ? ' ' + state : '');

  var icon = document.createElement('div');
  icon.className = 'event-icon';
  icon.textContent = iconFor(state);

  var label = document.createElement('div');
  label.textContent = eventName;

  btn.appendChild(icon);
  btn.appendChild(label);

  (function(en, b, ic) {
    b.onclick = function() { tapEvent(en, b, ic); };
  })(eventName, btn, icon);

  return btn;
}

function iconFor(state) {
  if (state === 'arrived')  return '✓';
  if (state === 'departed') return '◁';
  return '·';
}

function tapEvent(eventName, btn, icon) {
  resetTimer();
  var current = getState(currentPerson, eventName);
  var next;
  if (!current)                   next = 'arrived';
  else if (current === 'arrived') next = 'departed';
  else                            next = null;

  setState(currentPerson, eventName, next);
  btn.className = 'event-btn' + (next ? ' ' + next : '');
  icon.textContent = iconFor(next);

  if (next) {
    signins.push({
      name: currentPerson, event: eventName, hall: HALL_NAME,
      action: next, date: todayKey(), time: nowTime(), timestamp: new Date().toISOString()
    });
    saveData();
    toast(next === 'arrived' ? '✓ Arrived — ' + currentPerson : '◁ Departed — ' + currentPerson);
  } else {
    toast('Cleared');
  }

  stopTimer();
  if (tapReturnTimer) { clearTimeout(tapReturnTimer); tapReturnTimer = null; }
  tapReturnTimer = setTimeout(goNames, 6000);
}

function tapDone(btn) {
  btn.classList.add('done-clicked');
  btn.disabled = true;
  if (tapReturnTimer) { clearTimeout(tapReturnTimer); tapReturnTimer = null; }
  setTimeout(goNames, 1500);
}

// ── Timer ─────────────────────────────────────────────────

function startTimer() {
  stopTimer();
  var fill = document.getElementById('timer-fill');
  fill.style.transition = 'none';
  fill.style.width = '100%';
  fill.getBoundingClientRect();
  fill.style.transition = 'width ' + AUTO_TIMEOUT + 'ms linear';
  fill.style.width = '0%';
  autoTimer = setTimeout(goNames, AUTO_TIMEOUT);
}

function resetTimer() { startTimer(); }

function stopTimer() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  var fill = document.getElementById('timer-fill');
  if (fill) { fill.style.transition = 'none'; fill.style.width = '100%'; }
}

// ── Toast ─────────────────────────────────────────────────

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 1800);
}

// ── Admin ─────────────────────────────────────────────────

function openAdmin() {
  document.getElementById('admin-overlay').classList.add('open');
  try { renderAdminRecords(); } catch(e) {}
}
function closeAdmin() { document.getElementById('admin-overlay').classList.remove('open'); }
function maybeCloseAdmin(e) { if (e.target === document.getElementById('admin-overlay')) closeAdmin(); }

function renderAdminRecords() {
  var el = document.getElementById('admin-records');
  if (!signins.length) { el.innerHTML = '<div class="record-summary">No records yet.</div>'; return; }
  var byDate = {};
  for (var i = 0; i < signins.length; i++) {
    var r = signins[i];
    var d = r.date || 'unknown';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(r);
  }
  el.innerHTML = '';
  var dates = Object.keys(byDate).sort(function(a, b) { return b.localeCompare(a); });
  for (var j = 0; j < dates.length; j++) {
    var date = dates[j];
    var recs = byDate[date];
    var arrived = 0; var departed = 0;
    for (var k = 0; k < recs.length; k++) {
      if (recs[k].action === 'arrived')  arrived++;
      if (recs[k].action === 'departed') departed++;
    }
    var div = document.createElement('div');
    div.className = 'record-summary';
    div.innerHTML = '<strong>' + date + '</strong> — ' + recs.length + ' record' + (recs.length !== 1 ? 's' : '') + ' (' + arrived + ' in, ' + departed + ' out)';
    el.appendChild(div);
  }
}

function exportCSV() {
  if (!signins.length) { toast('No records to export'); return; }
  var header = 'Name,Event,Hall,Action,Date,Time\n';
  var rows = [];
  for (var i = 0; i < signins.length; i++) {
    var r = signins[i];
    var row = [r.name, r.event, r.hall || HALL_NAME, r.action, r.date, r.time]
      .map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    rows.push(row);
  }
  var csv = header + rows.join('\n');
  var filename = 'attendance_swoon_' + todayKey() + '.csv';
  if (navigator.share) {
    try {
      var file = new File([csv], filename, {type: 'text/csv'});
      var shareData = {files: [file]};
      if (navigator.canShare && navigator.canShare(shareData)) {
        navigator.share(shareData).catch(function() { showCSVFallback(csv); });
        return;
      }
    } catch(e) {}
    navigator.share({title: filename, text: csv}).catch(function() { showCSVFallback(csv); });
    return;
  }
  showCSVFallback(csv);
}

function showCSVFallback(csv) {
  var ta = document.getElementById('csv-text');
  ta.value = csv;
  document.getElementById('csv-output').style.display = 'block';
  ta.focus();
  ta.select();
}

function selectCSV() {
  var ta = document.getElementById('csv-text');
  ta.focus();
  ta.select();
  try { document.execCommand('selectAll'); } catch(e) {}
}

function clearToday() {
  delete attendanceState[todayKey()];
  var dk = todayKey();
  var filtered = [];
  for (var i = 0; i < signins.length; i++) { if (signins[i].date !== dk) filtered.push(signins[i]); }
  signins = filtered;
  saveData(); toast("Today's records cleared"); closeAdmin();
}

function clearAll() {
  var btn = document.getElementById('clear-all-btn');
  if (!btn) return;
  if (!clearAllConfirm) {
    clearAllConfirm = true;
    btn.textContent = '⚠️ Tap again to confirm — cannot be undone';
    if (clearAllTimer) clearTimeout(clearAllTimer);
    clearAllTimer = setTimeout(function() {
      clearAllConfirm = false;
      clearAllTimer = null;
      if (btn) btn.textContent = '⚠️ Clear all data';
    }, 4000);
    return;
  }
  clearAllConfirm = false;
  if (clearAllTimer) { clearTimeout(clearAllTimer); clearAllTimer = null; }
  attendanceState = {}; signins = [];
  saveData(); toast('All data cleared'); closeAdmin();
  btn.textContent = '⚠️ Clear all data';
}

// ── Init ──────────────────────────────────────────────────
loadData();
renderNames();
</script>
</body>
</html>
