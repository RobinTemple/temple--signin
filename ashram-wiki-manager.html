let sel=null,srch="",grp="alpha",sfil="all";
const byName=n=>D.find(d=>d.name===n);
const goto=n=>{const d=byName(n);if(d){sel=d.id;render()}};
function getF(){const q=srch.toLowerCase().trim();let r=D;if(sfil!=="all")r=r.filter(d=>d.status===sfil);if(q)r=r.filter(d=>d.name.toLowerCase().includes(q)||d.services.some(s=>s.toLowerCase().includes(q))||[...d.managedBy,...d.manages].some(m=>m.toLowerCase().includes(q)));return r;}
function mkChip(name,type){const d=byName(name),isLink=!!d;const el=document.createElement("span");el.className="chip "+(isLink?(type==="m"?"cm":"cr"):"cp");el.innerHTML=name+(isLink?" →":"");if(isLink)el.onclick=()=>goto(name);return el;}
function renderSB(){
  const f=getF();const cnt={covered:D.filter(d=>d.status==="covered").length,partial:D.filter(d=>d.status==="partial").length,gap:D.filter(d=>d.status==="gap").length,unknown:D.filter(d=>d.status==="unknown").length};
  const fil=document.getElementById("fil");fil.innerHTML="";
  [["all","All "+D.length,null],["covered","✓ "+cnt.covered,"#16a34a"],["partial","~ "+cnt.partial,"#d97706"],["gap","! "+cnt.gap,"#dc2626"],["unknown","? "+cnt.unknown,"#9ca3af"]].forEach(([v,lbl,c])=>{
    const b=document.createElement("button");b.className="ftog"+(sfil===v?" on":"");b.textContent=lbl;b.dataset.f=v;
    if(sfil===v&&c)b.style.cssText=`background:${c};color:#fff;border-color:${c}`;
    else if(sfil===v)b.style.cssText="background:#c8a16a;color:#1c3251;border-color:#c8a16a";
    fil.appendChild(b);
  });
  const sl=document.getElementById("sl");let h="";
  if(grp==="alpha"){
    [...f].sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{const sc=SC[d.status];h+=`<div class="ni${sel===d.id?" on":""}" data-id="${d.id}"><span class="sdot" style="background:${sc.dot}"></span><span style="flex:1">${d.name}</span>${d.manages.length?'<span class="sbdg mgr-b">MGR</span>':''}${d.status==="gap"?'<span class="sbdg gap-b">GAP</span>':''}</div>`;});
  } else {
    const groups={};f.forEach(d=>{const ks=d.managedBy.filter(m=>byName(m));const keys=ks.length?ks:["No manager assigned"];keys.forEach(k=>{if(!groups[k])groups[k]=[];if(!groups[k].find(x=>x.id===d.id))groups[k].push(d)});});
    Object.entries(groups).sort(([a],[b])=>a==="No manager assigned"?1:b==="No manager assigned"?-1:a.localeCompare(b)).forEach(([mgr,devs])=>{h+=`<div class="gl">${mgr}</div>`;[...devs].sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{const sc=SC[d.status];h+=`<div class="ni${sel===d.id?" on":""}" data-id="${d.id}" style="padding-left:18px"><span class="sdot" style="background:${sc.dot}"></span><span style="flex:1">${d.name}</span>${d.status==="gap"?'<span class="sbdg gap-b">GAP</span>':''}</div>`;});});
  }
  sl.innerHTML=h;
  document.getElementById("sft").innerHTML=`<span>${D.filter(d=>d.complete).length}/${D.length} complete</span><span style="color:#ef4444;font-weight:600">⚠ ${D.filter(d=>d.status==="gap").length} gaps</span>`;
}
function renderMain(){
  const main=document.getElementById("main");const d=sel?D.find(x=>x.id===sel):null;
  if(!d){
    let h=`<div class="home"><h2>Devotee service directory</h2><div class="home-sec"><div class="sec-lbl">Priority gaps — no human manager assigned</div>`;
    D.filter(d=>d.status==="gap"&&d.complete).forEach(d=>{h+=`<div class="gap-card" data-nav="${d.id}"><span style="font-size:11px;font-weight:700;color:#dc2626;flex-shrink:0">GAP</span><div><div style="font-size:13px;font-weight:600;color:#7f1d1d">${d.name}</div><div style="font-size:12px;color:#991b1b;margin-top:2px">${d.services.length} services · ${d.notes.split('.')[0]}</div></div></div>`;});
    h+=`</div><div class="home-sec"><div class="sec-lbl">Key managers</div><div id="mc"></div></div></div>`;
    main.innerHTML=h;
    const mc=main.querySelector("#mc");D.filter(x=>x.manages.length>0).sort((a,b)=>a.name.localeCompare(b.name)).forEach(m=>{const el=document.createElement("div");el.className="mgr-card";el.dataset.nav=m.id;el.innerHTML=`${m.name} <span class="rpt-b">${m.manages.length} report${m.manages.length>1?"s":""}</span>`;el.onclick=()=>{sel=m.id;render()};mc.appendChild(el);});
    main.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",()=>{sel=el.dataset.nav;render()}));
  } else {
    const sc=SC[d.status];
    let h=`<div class="ph"><button class="bb" id="bb">← All devotees</button><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="pn">${d.name}</div><span style="padding:4px 12px;border-radius:16px;font-size:11px;font-weight:700;background:${sc.bg};color:${sc.txt};border:1px solid ${sc.bdr};flex-shrink:0">● ${sc.lbl.toUpperCase()}</span></div></div><div class="pb">`;
    if(d.managedBy.length)h+=`<div style="margin-bottom:18px"><div class="sec-lbl">Accountable to</div><div id="pc" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>`;
    if(d.manages.length)h+=`<div style="margin-bottom:18px"><div class="sec-lbl">Manages</div><div id="rc" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>`;
    if(d.status==="gap")h+=`<div class="gbox" style="margin-bottom:16px"><strong>⚠ Management gap:</strong> ${d.notes}</div>`;
    h+=`<div style="margin-bottom:18px"><div class="sec-lbl">Service areas${d.services.length?" · "+d.services.length:""}</div>`;
    if(d.services.length)d.services.forEach(s=>{h+=`<div class="srow">${s}</div>`;});else h+=`<div class="sem">Service details not yet documented.</div>`;
    h+=`</div>`;
    if(d.notes&&d.status!=="gap")h+=`<div style="margin-bottom:18px"><div class="sec-lbl">Notes</div><div class="nbox">${d.notes}</div></div>`;
    h+=`</div>`;main.innerHTML=h;
    const pc=main.querySelector("#pc");if(pc)d.managedBy.forEach(m=>pc.appendChild(mkChip(m,"m")));
    const rc=main.querySelector("#rc");if(rc)d.manages.forEach(m=>rc.appendChild(mkChip(m,"r")));
    main.querySelector("#bb").onclick=()=>{sel=null;render()};
  }
}
function render(){renderSB();renderMain();document.getElementById("sl").addEventListener("click",e=>{const it=e.target.closest("[data-id]");if(it){sel=it.dataset.id;render()}});document.getElementById("fil").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){sfil=b.dataset.f;render()}});document.getElementById("ta").onclick=()=>{grp="alpha";render()};document.getElementById("ta").className="tog"+(grp==="alpha"?" on":"");document.getElementById("tm").onclick=()=>{grp="mgr";render()};document.getElementById("tm").className="tog"+(grp==="mgr"?" on":"");document.getElementById("si").value=srch;document.getElementById("si").oninput=e=>{srch=e.target.value;renderSB();document.getElementById("sl").addEventListener("click",ev=>{const it=ev.target.closest("[data-id]");if(it){sel=it.dataset.id;render()}});};}
render();
</script>
